<!doctype html><html lang="ko"><meta charset="utf-8"><title>검사기 검증용 예시</title><style>body{font:16px/1.6 system-ui;margin:40px;max-width:780px}h1{font-size:28px}button,a,input{padding:12px;margin:8px 0}button{color:white;background:#1760c2;border:0;border-radius:4px}.repeated{padding:12px;background:#edf1f5;margin:8px 0}#edge{position:fixed;right:12px;bottom:16px;max-width:300px;overflow-wrap:anywhere}</style><h1>에이전트에게 수정할 요소 전달</h1><p>이 페이지는 검사기 행동·화면 검증용 합성 데이터입니다.</p><button id="save:button" class="primary action" onpointerdown="window.downCount++" onclick="window.clickCount++">변경 사항 저장</button><p><a href="#destination" id="link">이동 링크</a></p><div class="repeated">첫 번째 반복 요소</div><div class="repeated">두 번째 반복 요소</div><article><p>식별자가 없는 문단</p></article><label>입력 중 단축키 보존 <input placeholder="텍스트 입력"></label><div id="edge" class="very-long-class-name-for-checking-viewport-overflow-and-wrapping">화면 끝 요소</div><div id="shadow-host"></div><iframe title="하위 프레임" src="/frame" style="width:300px;height:100px"></iframe><script>if(location.pathname==='/frame'){document.body.innerHTML='<button id="frame-button">프레임 요소</button>';}else{const root=document.querySelector('#shadow-host').attachShadow({mode:'open'});root.innerHTML='<button id="shadow-button">열린 Shadow 요소</button>';}window.clickCount=0;window.downCount=0;</script></html>
